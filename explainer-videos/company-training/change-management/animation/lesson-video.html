<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson timeline (video-backed)</title>
<link rel="stylesheet" href="mckinsey.css">
<link rel="stylesheet" href="info.css">
</head>
<body>
<div id="stage"></div>
<script src="info.js"></script>
<script>
/*
 * VIDEO A variant of lesson.html: illustrated beats are backed by real MOVING
 * clips (clips/<id>.mp4 from kie image-to-video) instead of still art. Everything
 * else — captions, cross-dissolves, entrance motion, info cards, VO/music/bumpers
 * (added downstream) — is identical. seekTo(ms) is async: it seeks each visible
 * <video> to the exact beat-local time before the frame is captured (LAW 7).
 */
const stage = document.getElementById('stage');
function buildData() { return window.__DATA || null; }
const CLIPS = () => (window.__DATA && window.__DATA.clips) || {};

function makeLayer(beat) {
  const L = document.createElement('div');
  L.className = 'layer'; L.dataset.id = beat.id;
  const hasClip = !!CLIPS()[beat.id];

  if (beat.mode === 'info' && beat.info && window.InfoTemplates[beat.info.tpl]) {
    const wrap = document.createElement('div'); wrap.className = 'info-wrap';
    wrap.appendChild(window.InfoTemplates[beat.info.tpl](beat.info.data || {}));
    L.appendChild(wrap);
  } else if (hasClip) {
    const v = document.createElement('video'); v.className = 'fill';
    v.src = `../clips/${beat.id}.mp4`; v.muted = true; v.playsInline = true;
    v.preload = 'auto'; v.setAttribute('muted', ''); v.pause();
    L.appendChild(v);
  } else {
    const img = document.createElement('img'); img.className = 'fill'; img.src = `../art/${beat.id}.png`;
    L.appendChild(img);
  }
  if (beat.cap) { const c = document.createElement('div'); c.className = 'caption'; c.textContent = beat.cap; L.appendChild(c); }
  return L;
}

let TL = [];
function buildTimeline(data) {
  let t = 0;
  data.beats.forEach((b) => {
    const dur = (data.durations[b.id] || 2) * 1000;
    const layer = makeLayer(b);
    stage.appendChild(layer);
    TL.push({ id: b.id, start: t, end: t + dur, dur, layer, beat: b });
    t += dur;
  });
}

// ---- deterministic drive ----------------------------------------------------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; const t = x - 1; return 1 + c3 * t * t * t + c1 * t * t; };
const XF = 320, ENTER = 520, EXIT = 340;

function driveLayer(item, ms) {
  const p = clamp((ms - item.start) / item.dur, 0, 1);
  const L = item.layer;
  const drift = Math.sin(ms / 900) * 3;
  const seed = (parseInt(item.beat.id, 36) || item.beat.id.charCodeAt(0));
  const dir = (seed % 2) ? 1 : -1;
  const variant = seed % 3;

  // entrance / exit motion on the container
  const eIn = easeOutBack(clamp((ms - item.start) / ENTER, 0, 1));
  const eOut = clamp((item.end - ms) / EXIT, 0, 1);
  const inSlide = (1 - eIn) * (dir * 40);
  const outSlide = (1 - eOut) * (dir * -22);
  const inScale = 0.97 + 0.03 * eIn;
  L.style.transform = `translateX(${(inSlide + outSlide).toFixed(1)}px) scale(${inScale.toFixed(4)})`;

  const media = L.querySelector('.fill');
  if (media) {
    if (media.tagName === 'VIDEO') {
      // let the AI motion be the motion — only a whisper of push-in + cover-scale
      const s = 1.03 + 0.02 * p;
      media.style.transform = `scale(${s.toFixed(4)})`;
    } else { // still image scene → Ken Burns (fallback if a clip is missing)
      let s, panX, panY, rot = 0;
      if (variant === 0) { s = 1.06 + 0.20 * p; panX = dir * (-18 + 36 * p); panY = -6 + 14 * p; }
      else if (variant === 1) { s = 1.26 - 0.18 * p; panX = dir * (14 - 28 * p); panY = 8 - 14 * p; }
      else { s = 1.08 + 0.18 * p; panX = dir * (-20 + 40 * p); panY = -10 + 20 * p; rot = dir * (0.8 - 1.6 * p); }
      panY += drift * 0.4;
      media.style.transform = `scale(${s.toFixed(4)}) translate(${panX.toFixed(1)}px, ${panY.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;
    }
  }
  // info card: springy scale-in, then gentle float
  const card = L.querySelector('.info-wrap');
  if (card && item.beat.mode === 'info') {
    const ci = easeOutBack(clamp(p / 0.20, 0, 1));
    card.style.transform = `translateY(${((1 - ci) * 40 + Math.sin(ms / 1100) * 3).toFixed(1)}px) scale(${(0.92 + 0.08 * ci).toFixed(3)})`;
  }
  // caption chip: springy slide-in from the left
  const cap = L.querySelector('.caption');
  if (cap) {
    const ca = easeOutBack(clamp((p - 0.06) / 0.22, 0, 1));
    cap.style.opacity = clamp((p - 0.06) / 0.14, 0, 1);
    cap.style.transform = `translateX(${((1 - ca) * -60).toFixed(1)}px)`;
  }
  // info reveals / late states / count-ups (unchanged)
  L.querySelectorAll('.seq').forEach((s, i) => {
    const seqs = L.querySelectorAll('.seq');
    const t0 = (i / Math.max(1, seqs.length)) * 0.62;
    const a = clamp((p - t0) / 0.14, 0, 1);
    const eb = easeOutBack(a);
    s.style.opacity = clamp(a * 1.3, 0, 1);
    s.style.transform = `translateY(${((1 - eb) * 30).toFixed(1)}px) scale(${(0.86 + 0.14 * eb).toFixed(3)})`;
  });
  L.querySelectorAll('.io-late').forEach((n) => {
    const on = p > 0.6;
    if (n.classList.contains('check')) n.classList.toggle('on', on);
    n.style.opacity = on ? 1 : 0.35;
    if (n.classList.contains('fillbar')) n.style.width = (on ? (n.dataset.pct || 0) : 0) + '%';
  });
  L.querySelectorAll('[data-tick]').forEach((n) => {
    const target = parseFloat(n.dataset.tick) || 0;
    const a = clamp((p - 0.1) / 0.6, 0, 1);
    n.textContent = String(Math.round(target * a));
  });
}

function seekVideo(v, sec) {
  return new Promise((res) => {
    const d = (v.duration && isFinite(v.duration)) ? v.duration : 5;
    const t = Math.max(0, Math.min(d - 0.05, sec % d));
    if (v.readyState >= 2 && Math.abs(v.currentTime - t) < 0.004) return res();
    let done = false;
    const on = () => { if (done) return; done = true; v.removeEventListener('seeked', on); res(); };
    v.addEventListener('seeked', on);
    try { v.currentTime = t; } catch (e) { on(); }
    setTimeout(on, 800); // safety: never hang the render
  });
}

window.seekTo = async function (ms) {
  const jobs = [];
  TL.forEach((it, i) => {
    let op = 0;
    if (ms >= it.start - XF && ms < it.start) op = (ms - (it.start - XF)) / XF;
    else if (ms >= it.start && ms < it.end - XF) op = 1;
    else if (ms >= it.end - XF && ms < it.end) op = clamp((it.end - ms) / XF, 0, 1);
    it.layer.style.opacity = op;
    it.layer.style.zIndex = i + 1;
    if (op > 0) {
      const v = it.layer.querySelector('video.fill');
      if (v) jobs.push(seekVideo(v, (ms - it.start) / 1000));
    }
  });
  await Promise.all(jobs);
  TL.forEach((it) => { if (parseFloat(it.layer.style.opacity) > 0) driveLayer(it, ms); });
};

(function init() {
  const data = buildData();
  const go = (d) => {
    buildTimeline(d);
    const vids = [...document.querySelectorAll('video')];
    const ready = vids.map((v) => new Promise((res) => {
      if (v.readyState >= 2) return res();
      v.addEventListener('loadeddata', () => res(), { once: true });
      v.addEventListener('error', () => res(), { once: true });
      setTimeout(res, 8000);
    }));
    Promise.all(ready)
      .then(() => Promise.all([...document.images].map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve())))
      .then(() => window.seekTo(0))
      .then(() => { window.ready = true; });
  };
  if (data) { go(data); }
  else { fetch('./data.json').then(r => r.json()).then(go).catch(() => { document.title = 'no data'; window.ready = true; }); }
})();
</script>
</body>
</html>
