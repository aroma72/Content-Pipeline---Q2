<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson timeline (object-separated)</title>
<link rel="stylesheet" href="mckinsey.css">
<link rel="stylesheet" href="info.css">
<style>
  /* Video B v2: each scene object is its own layer, animated independently */
  .cream { position: absolute; inset: 0; }
  .obj { position: absolute; will-change: transform; }
  .obj.char { height: auto; }
  .obj svg { display: block; width: 100%; height: auto; overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="info.js"></script>
<script>
/*
 * VIDEO B (v2) — OBJECT-SEPARATED motion. Instead of splitting one character into
 * body parts, each beat is composed of independent OBJECTS that move on their own:
 *   • cream background
 *   • the character (boy.png cutout) — animated as one whole object
 *   • the prop (app tile / envelope / calendar) — drawn as its own SVG, animated separately
 * Scene beats keep the camera move; info beats keep the animated cards. Deterministic seekTo.
 */
const stage = document.getElementById('stage');
function buildData() { return window.__DATA || null; }
const ANCH = () => (window.__DATA && window.__DATA.anchors) || {};

// prop definition per ali beat: kind + placement (% of 1920x1080 stage)
const PROPS = {
  '03': { kind: 'tile',     left: 24, top: 24, w: 16 },
  '04': { kind: 'envelope', left: 58, top: 40, w: 13 },
  '05': { kind: 'calendar', left: 60, top: 20, w: 20 },
};

function propSVG(kind) {
  if (kind === 'tile') return `<svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="20" fill="#ffffff" stroke="#d9d2c4" stroke-width="2"/><rect x="26" y="30" width="48" height="8" rx="4" fill="#cfe3e2"/><rect x="26" y="46" width="34" height="8" rx="4" fill="#e3ded2"/><rect x="26" y="62" width="42" height="8" rx="4" fill="#e3ded2"/></svg>`;
  if (kind === 'envelope') return `<svg viewBox="0 0 120 90"><rect x="6" y="12" width="108" height="72" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="2.5"/><path d="M10 18 L60 54 L110 18" fill="none" stroke="#8fb6b3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if (kind === 'calendar') return `<svg viewBox="0 0 120 100"><rect x="6" y="10" width="108" height="84" rx="10" fill="#ffffff" stroke="#d9d2c4" stroke-width="2.5"/><rect x="6" y="10" width="108" height="20" rx="10" fill="#8fb6b3"/><g stroke="#e3ded2" stroke-width="2"><line x1="33" y1="30" x2="33" y2="94"/><line x1="60" y1="30" x2="60" y2="94"/><line x1="87" y1="30" x2="87" y2="94"/><line x1="6" y1="52" x2="114" y2="52"/><line x1="6" y1="73" x2="114" y2="73"/></g></svg>`;
  return '';
}

function placePct(node, left, top, w) { node.style.left = left + '%'; node.style.top = top + '%'; node.style.width = w + '%'; }

function makeLayer(beat, anchors) {
  const L = document.createElement('div');
  L.className = 'layer'; L.dataset.id = beat.id;
  const prop = PROPS[beat.id];

  if (beat.mode === 'info' && beat.info && window.InfoTemplates[beat.info.tpl]) {
    const wrap = document.createElement('div'); wrap.className = 'info-wrap';
    wrap.appendChild(window.InfoTemplates[beat.info.tpl](beat.info.data || {}));
    L.appendChild(wrap);
  } else if (beat.mode === 'ali' && anchors && prop) {
    // cream background object
    const bg = document.createElement('div'); bg.className = 'cream';
    const cr = anchors.cream || [243, 239, 230];
    bg.style.background = `rgb(${cr[0]},${cr[1]},${cr[2]})`;
    L.appendChild(bg);
    // prop object (its own SVG layer)
    const pd = document.createElement('div'); pd.className = 'obj prop'; pd.dataset.kind = prop.kind;
    pd.innerHTML = propSVG(prop.kind); placePct(pd, prop.left, prop.top, prop.w);
    L.appendChild(pd);
    // character object (whole cutout)
    const ch = document.createElement('img'); ch.className = 'obj char'; ch.src = `../layers/${beat.id}/boy.png`;
    const bb = anchors.bbox, iw = anchors.image_w, ih = anchors.image_h;
    ch.style.left = (bb[0] / iw * 100) + '%';
    ch.style.top = (bb[1] / ih * 100) + '%';
    ch.style.width = ((bb[2] - bb[0]) / iw * 100) + '%';
    L.appendChild(ch);
  } else {
    const img = document.createElement('img'); img.className = 'fill'; img.src = `../art/${beat.id}.png`;
    L.appendChild(img);
  }
  if (beat.cap) { const c = document.createElement('div'); c.className = 'caption'; c.textContent = beat.cap; L.appendChild(c); }
  return L;
}

let TL = [];
function buildTimeline(data) {
  const anchors = data.anchors || {};
  let t = 0;
  data.beats.forEach((b) => {
    const dur = (data.durations[b.id] || 2) * 1000;
    const layer = makeLayer(b, anchors[b.id]);
    stage.appendChild(layer);
    TL.push({ id: b.id, start: t, end: t + dur, dur, layer, beat: b });
    t += dur;
  });
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; const t = x - 1; return 1 + c3 * t * t * t + c1 * t * t; };
const TAU = Math.PI * 2;
const XF = 320, ENTER = 520, EXIT = 340;

function driveLayer(item, ms) {
  const p = clamp((ms - item.start) / item.dur, 0, 1);
  const L = item.layer;
  const drift = Math.sin(ms / 900) * 3;
  const seed = (parseInt(item.beat.id, 36) || item.beat.id.charCodeAt(0));
  const dir = (seed % 2) ? 1 : -1;
  const variant = seed % 3;

  const eIn = easeOutBack(clamp((ms - item.start) / ENTER, 0, 1));
  const eOut = clamp((item.end - ms) / EXIT, 0, 1);
  L.style.transform = `translateX(${((1 - eIn) * (dir * 40) + (1 - eOut) * (dir * -22)).toFixed(1)}px) scale(${(0.97 + 0.03 * eIn).toFixed(4)})`;

  // scene / fallback still → Ken Burns
  const img = L.querySelector('.fill');
  if (img && item.beat.mode === 'scene') {
    let s, panX, panY, rot = 0;
    if (variant === 0) { s = 1.06 + 0.20 * p; panX = dir * (-18 + 36 * p); panY = -6 + 14 * p; }
    else if (variant === 1) { s = 1.26 - 0.18 * p; panX = dir * (14 - 28 * p); panY = 8 - 14 * p; }
    else { s = 1.08 + 0.18 * p; panX = dir * (-20 + 40 * p); panY = -10 + 20 * p; rot = dir * (0.8 - 1.6 * p); }
    panY += drift * 0.4;
    img.style.transform = `scale(${s.toFixed(4)}) translate(${panX.toFixed(1)}px, ${panY.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;
  }

  // OBJECT 1 — the character, animated as ONE whole object
  const ch = L.querySelector('.obj.char');
  if (ch) {
    const pop = easeOutBack(clamp(p / 0.16, 0, 1));
    const rise = (1 - pop) * 52;
    const bob = 3.4 * Math.sin(p * TAU * 1.4);
    const sway = 0.9 * Math.sin(p * TAU * 0.85);
    const breathe = 1 + 0.014 * Math.sin(p * TAU * 2.0);
    ch.style.opacity = clamp(p / 0.10, 0, 1);
    ch.style.transformOrigin = '50% 100%';
    ch.style.transform = `translate(${(drift * 0.4).toFixed(1)}px, ${(rise + bob).toFixed(1)}px) rotate(${sway.toFixed(2)}deg) scaleY(${breathe.toFixed(4)})`;
  }

  // OBJECT 2 — the prop, animated independently (its own path/phase)
  const prop = L.querySelector('.obj.prop');
  if (prop) {
    const kind = prop.dataset.kind;
    const inPop = easeOutBack(clamp((p - 0.08) / 0.22, 0, 1));
    prop.style.opacity = clamp((p - 0.08) / 0.12, 0, 1);
    let tx = 0, ty = 0, rot = 0, sc = 1;
    if (kind === 'tile') {                 // hovering + gentle pulse
      ty = 10 * Math.sin(p * TAU * 1.1) - (1 - inPop) * 30;
      sc = 1 + 0.05 * Math.sin(p * TAU * 1.6);
      rot = 2.0 * Math.sin(p * TAU * 0.7);
    } else if (kind === 'envelope') {      // bob + periodic "tap" squash
      ty = 8 * Math.sin(p * TAU * 1.3) - (1 - inPop) * 26;
      const tap = Math.max(0, Math.sin(p * TAU * 2.0));
      sc = 1 - 0.10 * (tap * tap);         // quick squashes = being tapped
      rot = -2.5 * Math.sin(p * TAU * 0.9);
    } else if (kind === 'calendar') {      // slow sway + float (feels neglected/still-ish)
      ty = 6 * Math.sin(p * TAU * 0.8) - (1 - inPop) * 24;
      rot = 1.6 * Math.sin(p * TAU * 0.5);
      sc = 1 + 0.02 * Math.sin(p * TAU * 0.9);
    }
    prop.style.transformOrigin = '50% 50%';
    prop.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${(sc * (0.85 + 0.15 * inPop)).toFixed(3)})`;
  }

  // info card + caption + reveals
  const card = L.querySelector('.info-wrap');
  if (card && item.beat.mode === 'info') {
    const ci = easeOutBack(clamp(p / 0.20, 0, 1));
    card.style.transform = `translateY(${((1 - ci) * 40 + Math.sin(ms / 1100) * 3).toFixed(1)}px) scale(${(0.92 + 0.08 * ci).toFixed(3)})`;
  }
  const cap = L.querySelector('.caption');
  if (cap) {
    const ca = easeOutBack(clamp((p - 0.06) / 0.22, 0, 1));
    cap.style.opacity = clamp((p - 0.06) / 0.14, 0, 1);
    cap.style.transform = `translateX(${((1 - ca) * -60).toFixed(1)}px)`;
  }
  L.querySelectorAll('.seq').forEach((s, i) => {
    const seqs = L.querySelectorAll('.seq');
    const t0 = (i / Math.max(1, seqs.length)) * 0.62;
    const a = clamp((p - t0) / 0.14, 0, 1);
    const eb = easeOutBack(a);
    s.style.opacity = clamp(a * 1.3, 0, 1);
    s.style.transform = `translateY(${((1 - eb) * 30).toFixed(1)}px) scale(${(0.86 + 0.14 * eb).toFixed(3)})`;
  });
  L.querySelectorAll('.io-late').forEach((n) => {
    const on = p > 0.6;
    if (n.classList.contains('check')) n.classList.toggle('on', on);
    n.style.opacity = on ? 1 : 0.35;
    if (n.classList.contains('fillbar')) n.style.width = (on ? (n.dataset.pct || 0) : 0) + '%';
  });
  L.querySelectorAll('[data-tick]').forEach((n) => {
    const target = parseFloat(n.dataset.tick) || 0;
    const a = clamp((p - 0.1) / 0.6, 0, 1);
    n.textContent = String(Math.round(target * a));
  });
}

window.seekTo = function (ms) {
  TL.forEach((it, i) => {
    let op = 0;
    if (ms >= it.start - XF && ms < it.start) op = (ms - (it.start - XF)) / XF;
    else if (ms >= it.start && ms < it.end - XF) op = 1;
    else if (ms >= it.end - XF && ms < it.end) op = clamp((it.end - ms) / XF, 0, 1);
    it.layer.style.opacity = op;
    it.layer.style.zIndex = i + 1;
    if (op > 0) driveLayer(it, ms);
  });
};

(function init() {
  const data = buildData();
  const go = (d) => {
    buildTimeline(d); window.seekTo(0);
    Promise.all([...document.images].map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve()))
      .then(() => { window.ready = true; });
  };
  if (data) { go(data); }
  else { fetch('./data.json').then(r => r.json()).then(go).catch(() => { document.title = 'no data'; window.ready = true; }); }
})();
</script>
</body>
</html>
