<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson timeline</title>
<link rel="stylesheet" href="mckinsey.css">
<link rel="stylesheet" href="info.css">
</head>
<body>
<div id="stage"></div>
<script src="info.js"></script>
<script>
/*
 * The seekable timeline (LAW 7: deterministic / seekable).
 * compile-lesson.js injects window.__DATA = {beats, durations, anchors} BEFORE
 * this runs (see evaluateOnNewDocument); for a standalone browser preview we
 * fall back to fetching ./data.json. Every visual state is a pure function of
 * time — seekTo(ms) recomputes from scratch, so frame-stepping is exact.
 */
const stage = document.getElementById('stage');

function buildData() {
  return window.__DATA || null;
}

function makeLayer(beat, anchors) {
  const L = document.createElement('div');
  L.className = 'layer'; L.dataset.id = beat.id;

  if (beat.mode === 'info' && beat.info && window.InfoTemplates[beat.info.tpl]) {
    const wrap = document.createElement('div'); wrap.className = 'info-wrap';
    wrap.appendChild(window.InfoTemplates[beat.info.tpl](beat.info.data || {}));
    L.appendChild(wrap);
  } else if (beat.mode === 'ali' && anchors) {
    const plate = document.createElement('img'); plate.className = 'fill'; plate.src = `../layers/${beat.id}/plate.png`;
    L.appendChild(plate);
    const boy = document.createElement('img'); boy.className = 'puppet'; boy.src = `../layers/${beat.id}/boy.png`;
    const bb = anchors.bbox, iw = anchors.image_w, ih = anchors.image_h;
    boy.style.left = (bb[0] / iw * 100) + '%';
    boy.style.top = (bb[1] / ih * 100) + '%';
    boy.style.width = ((bb[2] - bb[0]) / iw * 100) + '%';
    L.appendChild(boy);
    if (beat.overlay && window.InfoTemplates[beat.overlay.tpl]) {
      const ob = document.createElement('div'); ob.className = 'overlay-box';
      ob.appendChild(window.InfoTemplates[beat.overlay.tpl](beat.overlay.data || {}));
      L.appendChild(ob);
    }
  } else {
    // scene (or ali fallback with no cutout): full art + lower-third caption
    const img = document.createElement('img'); img.className = 'fill'; img.src = `../art/${beat.id}.png`;
    L.appendChild(img);
  }
  if (beat.cap) { const c = document.createElement('div'); c.className = 'caption'; c.textContent = beat.cap; L.appendChild(c); }
  return L;
}

let TL = [];       // [{id,start,end,dur,layer}]
function buildTimeline(data) {
  const anchors = data.anchors || {};
  let t = 0;
  data.beats.forEach((b) => {
    const dur = (data.durations[b.id] || 2) * 1000;
    const layer = makeLayer(b, anchors[b.id]);
    stage.appendChild(layer);
    TL.push({ id: b.id, start: t, end: t + dur, dur, layer, beat: b });
    t += dur;
  });
}

// ---- deterministic drive ----------------------------------------------------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
// springy overshoot easing for lively "pops"
const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; const t = x - 1; return 1 + c3 * t * t * t + c1 * t * t; };
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const XF = 320;     // cross-dissolve overlap between beats (ms)
const ENTER = 520;  // entrance-motion window at each beat start (ms)
const EXIT = 340;   // exit-motion window at each beat end (ms)

function driveLayer(item, ms) {
  const p = clamp((ms - item.start) / item.dur, 0, 1); // beat progress 0..1
  const L = item.layer;
  const drift = Math.sin(ms / 900) * 3; // continuous gentle drift (Law 6: never dead-still)
  const seed = (parseInt(item.beat.id, 36) || item.beat.id.charCodeAt(0));
  const dir = (seed % 2) ? 1 : -1;                    // alternate pan per beat
  const variant = seed % 3;                            // camera personality per beat

  // ---- beat-level entrance / exit motion on the container (slide + scale + settle) ----
  const eIn = easeOutBack(clamp((ms - item.start) / ENTER, 0, 1));   // 0..1 springy in
  const eOut = clamp((item.end - ms) / EXIT, 0, 1);                   // 1..0 near the end
  const inSlide = (1 - eIn) * (dir * 46);                             // slides in from a side
  const outSlide = (1 - eOut) * (dir * -26);                          // drifts out the other way
  const inScale = 0.965 + 0.035 * eIn;                                // settles up to full size
  L.style.transform = `translateX(${(inSlide + outSlide).toFixed(1)}px) scale(${inScale.toFixed(4)})`;

  // camera / Ken Burns — varied personality per beat so it never feels repetitive
  const img = L.querySelector('.fill');
  if (img) {
    if (item.beat.mode === 'scene') {
      let s, panX, panY, rot = 0;
      if (variant === 0) {          // push-in + pan
        s = 1.06 + 0.20 * p; panX = dir * (-18 + 36 * p); panY = -6 + 14 * p;
      } else if (variant === 1) {   // pull-back reveal
        s = 1.26 - 0.18 * p; panX = dir * (14 - 28 * p); panY = 8 - 14 * p;
      } else {                      // diagonal push-in + gentle rotate
        s = 1.08 + 0.18 * p; panX = dir * (-20 + 40 * p); panY = -10 + 20 * p; rot = dir * (0.8 - 1.6 * p);
      }
      panY += drift * 0.4;
      img.style.transform = `scale(${s.toFixed(4)}) translate(${panX.toFixed(1)}px, ${panY.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;
    } else {
      // ali plate: gentle push-in + counter-drift for parallax vs the puppet
      img.style.transform = `scale(${(1.04 + 0.08 * p).toFixed(4)}) translate(${(-drift * 0.4).toFixed(1)}px, 0)`;
    }
  }
  // puppet: pops into frame, then sway + breathe + vertical bob (clearly alive)
  const boy = L.querySelector('.puppet');
  if (boy) {
    const pop = easeOutBack(clamp(p / 0.16, 0, 1));     // entrance pop over first 16%
    const rise = (1 - pop) * 54;                        // rises up into place
    const sway = 1.3 * Math.sin(p * Math.PI * 2 * 1.2);
    const bob = 3.6 * Math.sin(p * Math.PI * 2 * 1.6);
    const breathe = 1 + 0.014 * Math.sin(p * Math.PI * 2 * 2.0);
    const pin = (0.82 + 0.18 * pop) + 0.06 * p;         // scales up from 0.82 as it pops
    boy.style.opacity = clamp(p / 0.10, 0, 1);
    boy.style.transform =
      `translate(${(drift * 0.5).toFixed(1)}px, ${(rise + bob + drift * 0.3).toFixed(1)}px) ` +
      `rotate(${sway.toFixed(2)}deg) scale(${(breathe * pin).toFixed(4)})`;
  }
  // info card: springy scale-in at the start, then continuous gentle float
  const card = L.querySelector('.info-wrap');
  if (card && item.beat.mode === 'info') {
    const ci = easeOutBack(clamp(p / 0.20, 0, 1));
    const float = Math.sin(ms / 1100) * 3;
    card.style.transform = `translateY(${((1 - ci) * 40 + float).toFixed(1)}px) scale(${(0.92 + 0.08 * ci).toFixed(3)})`;
  }
  // caption chip: slides in from the left with a spring
  const cap = L.querySelector('.caption');
  if (cap) {
    const ca = easeOutBack(clamp((p - 0.06) / 0.22, 0, 1));
    cap.style.opacity = clamp((p - 0.06) / 0.14, 0, 1);
    cap.style.transform = `translateX(${((1 - ca) * -60).toFixed(1)}px)`;
  }
  // staggered .seq reveals — springy pop (scale + rise), faster stagger
  const seqs = L.querySelectorAll('.seq');
  seqs.forEach((s, i) => {
    const t0 = (i / Math.max(1, seqs.length)) * 0.62;
    const a = clamp((p - t0) / 0.14, 0, 1);
    const eb = easeOutBack(a);
    s.style.opacity = clamp(a * 1.3, 0, 1);
    s.style.transform = `translateY(${((1 - eb) * 30).toFixed(1)}px) scale(${(0.86 + 0.14 * eb).toFixed(3)})`;
  });
  // late state changes
  L.querySelectorAll('.io-late').forEach((n) => {
    const on = p > 0.6;
    if (n.classList.contains('check')) n.classList.toggle('on', on);
    n.style.opacity = on ? 1 : 0.35;
    if (n.classList.contains('fillbar')) n.style.width = (on ? (n.dataset.pct || 0) : 0) + '%';
  });
  // text count-ups
  L.querySelectorAll('[data-tick]').forEach((n) => {
    const target = parseFloat(n.dataset.tick) || 0;
    const a = clamp((p - 0.1) / 0.6, 0, 1);
    n.textContent = String(Math.round(target * a));
  });
}

// cross-dissolve: layers overlap for XF ms at each boundary; later beats stack on top
window.seekTo = function (ms) {
  TL.forEach((it, i) => {
    let op = 0;
    if (ms >= it.start - XF && ms < it.start) op = (ms - (it.start - XF)) / XF;      // fade in (over prev tail)
    else if (ms >= it.start && ms < it.end - XF) op = 1;                              // fully visible
    else if (ms >= it.end - XF && ms < it.end) op = clamp((it.end - ms) / XF, 0, 1);  // fade out
    it.layer.style.opacity = op;
    it.layer.style.zIndex = i + 1;                                                    // later beat on top
    if (op > 0) driveLayer(it, ms);
  });
};

(function init() {
  const data = buildData();
  const go = (d) => { buildTimeline(d); window.seekTo(0);
    // wait for images to decode so screenshots aren't blank
    Promise.all([...document.images].map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve()))
      .then(() => { window.ready = true; }); };
  if (data) { go(data); }
  else { fetch('./data.json').then(r => r.json()).then(go).catch(e => { document.title = 'no data'; window.ready = true; }); }
})();
</script>
</body>
</html>
