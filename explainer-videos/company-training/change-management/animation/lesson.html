<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson timeline</title>
<link rel="stylesheet" href="mckinsey.css">
<link rel="stylesheet" href="info.css">
</head>
<body>
<div id="stage"></div>
<script src="info.js"></script>
<script>
/*
 * The seekable timeline (LAW 7: deterministic / seekable).
 * compile-lesson.js injects window.__DATA = {beats, durations, anchors} BEFORE
 * this runs (see evaluateOnNewDocument); for a standalone browser preview we
 * fall back to fetching ./data.json. Every visual state is a pure function of
 * time — seekTo(ms) recomputes from scratch, so frame-stepping is exact.
 */
const stage = document.getElementById('stage');

function buildData() {
  return window.__DATA || null;
}

function makeLayer(beat, anchors) {
  const L = document.createElement('div');
  L.className = 'layer'; L.dataset.id = beat.id;

  if (beat.mode === 'info' && beat.info && window.InfoTemplates[beat.info.tpl]) {
    const wrap = document.createElement('div'); wrap.className = 'info-wrap';
    wrap.appendChild(window.InfoTemplates[beat.info.tpl](beat.info.data || {}));
    L.appendChild(wrap);
  } else if (beat.mode === 'ali' && anchors) {
    const plate = document.createElement('img'); plate.className = 'fill'; plate.src = `../layers/${beat.id}/plate.png`;
    L.appendChild(plate);
    const boy = document.createElement('img'); boy.className = 'puppet'; boy.src = `../layers/${beat.id}/boy.png`;
    const bb = anchors.bbox, iw = anchors.image_w, ih = anchors.image_h;
    boy.style.left = (bb[0] / iw * 100) + '%';
    boy.style.top = (bb[1] / ih * 100) + '%';
    boy.style.width = ((bb[2] - bb[0]) / iw * 100) + '%';
    L.appendChild(boy);
    if (beat.overlay && window.InfoTemplates[beat.overlay.tpl]) {
      const ob = document.createElement('div'); ob.className = 'overlay-box';
      ob.appendChild(window.InfoTemplates[beat.overlay.tpl](beat.overlay.data || {}));
      L.appendChild(ob);
    }
  } else {
    // scene (or ali fallback with no cutout): full art + lower-third caption
    const img = document.createElement('img'); img.className = 'fill'; img.src = `../art/${beat.id}.png`;
    L.appendChild(img);
  }
  if (beat.cap) { const c = document.createElement('div'); c.className = 'caption'; c.textContent = beat.cap; L.appendChild(c); }
  return L;
}

let TL = [];       // [{id,start,end,dur,layer}]
function buildTimeline(data) {
  const anchors = data.anchors || {};
  let t = 0;
  data.beats.forEach((b) => {
    const dur = (data.durations[b.id] || 2) * 1000;
    const layer = makeLayer(b, anchors[b.id]);
    stage.appendChild(layer);
    TL.push({ id: b.id, start: t, end: t + dur, dur, layer, beat: b });
    t += dur;
  });
}

// ---- deterministic drive ----------------------------------------------------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function driveLayer(item, ms) {
  const p = clamp((ms - item.start) / item.dur, 0, 1); // beat progress 0..1
  const L = item.layer;
  const drift = Math.sin(ms / 900) * 3; // continuous gentle drift (Law 6: never dead-still)

  // camera / Ken Burns
  const img = L.querySelector('.fill');
  if (img) {
    if (item.beat.mode === 'scene') {
      const s = 1.05 + 0.10 * p;
      img.style.transform = `scale(${s}) translate(${(-2 + 4 * p)}px, ${drift * 0.3}px)`;
    } else {
      img.style.transform = `scale(${1.02 + 0.04 * p})`;
    }
  }
  // puppet sway + breathe
  const boy = L.querySelector('.puppet');
  if (boy) {
    const sway = 0.6 * Math.sin(p * Math.PI * 2 * 1.4);
    const breathe = 1 + 0.006 * Math.sin(p * Math.PI * 2 * 2.2);
    boy.style.transform = `rotate(${sway}deg) scale(${breathe}) translateY(${drift * 0.2}px)`;
  }
  // staggered .seq reveals across ~70% of the beat
  const seqs = L.querySelectorAll('.seq');
  seqs.forEach((s, i) => {
    const t0 = (i / Math.max(1, seqs.length)) * 0.7;
    const a = clamp((p - t0) / 0.12, 0, 1);
    s.style.opacity = a;
    s.style.transform = `translateY(${(1 - a) * 18}px)`;
  });
  // late state changes
  L.querySelectorAll('.io-late').forEach((n) => {
    const on = p > 0.6;
    if (n.classList.contains('check')) n.classList.toggle('on', on);
    n.style.opacity = on ? 1 : 0.35;
    if (n.classList.contains('fillbar')) n.style.width = (on ? (n.dataset.pct || 0) : 0) + '%';
  });
  // text count-ups
  L.querySelectorAll('[data-tick]').forEach((n) => {
    const target = parseFloat(n.dataset.tick) || 0;
    const a = clamp((p - 0.1) / 0.6, 0, 1);
    n.textContent = String(Math.round(target * a));
  });
}

window.seekTo = function (ms) {
  let active = TL[TL.length - 1];
  for (const it of TL) { if (ms >= it.start && ms < it.end) { active = it; break; } }
  for (const it of TL) it.layer.style.opacity = (it === active) ? 1 : 0;
  if (active) driveLayer(active, ms);
};

(function init() {
  const data = buildData();
  const go = (d) => { buildTimeline(d); window.seekTo(0);
    // wait for images to decode so screenshots aren't blank
    Promise.all([...document.images].map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve()))
      .then(() => { window.ready = true; }); };
  if (data) { go(data); }
  else { fetch('./data.json').then(r => r.json()).then(go).catch(e => { document.title = 'no data'; window.ready = true; }); }
})();
</script>
</body>
</html>
