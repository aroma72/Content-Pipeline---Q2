<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand bumper</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
  #b{position:relative;width:1920px;height:1080px;display:flex;flex-direction:column;
     align-items:center;justify-content:center;gap:28px;font-family:var(--ff,Georgia),serif}
  #logo{width:220px;height:220px;object-fit:contain;opacity:0}
  #logofallback{width:160px;height:160px;border-radius:32px;opacity:0}
  #brand{font-size:96px;font-weight:800;letter-spacing:1px;opacity:0}
  #title{font-size:64px;max-width:1400px;text-align:center;opacity:0}
  #tag,#sign{font-size:40px;opacity:0}
  #bar{position:absolute;bottom:0;left:0;height:12px;width:0}
</style>
</head>
<body>
<div id="b">
  <img id="logo" alt="">
  <div id="logofallback"></div>
  <div id="brand"></div>
  <div id="title"></div>
  <div id="tag"></div>
  <div id="sign"></div>
</div>
<script>
/* Deterministic bumper. render-bumpers.js injects window.__BUMPER before load and
   drives window.seekTo(ms). mode = 'intro' | 'outro'. */
const D = window.__BUMPER || { mode:'intro', title:'Lesson', cfg:{ brandName:'Drawing Room', tagline:'', signOff:'', bg:'#F5F1E8', ink:'#2E2A24', head:'#6B5344', accent:'#C08A3E', fontFamily:'Georgia' } };
const C = D.cfg;
document.documentElement.style.setProperty('--ff', C.fontFamily || 'Georgia');
document.getElementById('b').style.background = C.bg;
document.getElementById('brand').style.color = C.head;
document.getElementById('title').style.color = C.ink;
document.getElementById('tag').style.color = C.accent;
document.getElementById('sign').style.color = C.head;
document.getElementById('bar').style.background = C.accent;
document.getElementById('logofallback').style.background = C.accent;

const logo = document.getElementById('logo');
if (D.logoDataUri) { logo.src = D.logoDataUri; } else { logo.remove(); document.getElementById('logofallback').id = 'logo'; }

document.getElementById('brand').textContent = C.brandName || '';
document.getElementById('tag').textContent = C.tagline || '';
if (D.mode === 'intro') {
  document.getElementById('title').textContent = D.title || '';
  document.getElementById('sign').remove();
} else {
  document.getElementById('title').remove();
  document.getElementById('sign').textContent = C.signOff || '';
}

const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const dur = (D.mode==='intro'?(C.introSeconds||2.6):(C.outroSeconds||2.6))*1000;
window.seekTo = function(ms){
  const p = clamp(ms/dur,0,1);
  const rise=(d)=>clamp((p-d)/0.18,0,1);
  const set=(id,d,dy)=>{const n=document.getElementById(id); if(!n)return; const a=rise(d);
    n.style.opacity=a; n.style.transform=`translateY(${(1-a)*(dy||16)}px)`;};
  set('logo',0.02,24); document.getElementById('logo').style.transform=`scale(${0.9+0.1*rise(0.02)})`;
  set('brand',0.15,18);
  if(D.mode==='intro'){ set('title',0.4,18); set('tag',0.62,12);} else { set('sign',0.35,18); set('tag',0.15,12);}
  document.getElementById('bar').style.width=(p*100)+'%';
};
window.seekTo(0);
Promise.all([...document.images].map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve()))
  .then(()=>{window.ready=true;});
</script>
</body>
</html>
