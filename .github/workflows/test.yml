name: Test & Validate Infrastructure

on: [push, pull_request]

jobs:
  test:
    name: Run Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint - Check for hardcoded prompts
        run: |
          echo "Checking for hardcoded SYSTEM_PROMPT in skills/agents..."
          if grep -r "^SYSTEM_PROMPT = " skills/ agents/ --include="*.py"; then
            echo "ERROR: Hardcoded SYSTEM_PROMPT found. Extract to prompts/ directory."
            exit 1
          else
            echo "✓ No hardcoded prompts found"
          fi

      - name: Lint - Verify prompts directory
        run: |
          if [ ! -d "prompts/" ] || [ -z "$(ls -A prompts/)" ]; then
            echo "ERROR: prompts/ directory missing or empty"
            exit 1
          fi
          echo "✓ prompts/ directory exists with $(ls prompts/ | wc -l) files"

      - name: Lint - Check requirements.txt
        run: |
          if ! grep -q "^pytest" requirements.txt; then
            echo "ERROR: pytest removed from requirements.txt"
            exit 1
          fi
          echo "✓ pytest in requirements.txt"

      - name: Run unit tests
        run: |
          pytest tests/test_signal_intake.py -v --tb=short

      - name: Run all tests with coverage
        run: |
          pytest tests/ -v --cov=skills --cov=agents --cov-report=term-missing

      - name: Validate pipeline structure
        run: |
          python main.py --dry-run > /tmp/pipeline.log
          if grep -q "PERCEIVE" /tmp/pipeline.log && grep -q "PLAN" /tmp/pipeline.log; then
            echo "✓ Pipeline structure validated"
            cat /tmp/pipeline.log
          else
            echo "ERROR: Pipeline structure validation failed"
            cat /tmp/pipeline.log
            exit 1
          fi

      - name: Verify logger directory
        run: |
          if [ ! -d ".claude/logs" ]; then
            echo "ERROR: .claude/logs directory missing"
            exit 1
          fi
          echo "✓ Logger directory exists"

      - name: Check eval dataset
        run: |
          if [ ! -d "tests/eval_dataset/sample_sessions" ]; then
            echo "ERROR: eval dataset missing"
            exit 1
          fi
          echo "✓ Eval dataset exists with $(find tests/eval_dataset -type d -name session_* | wc -l) sessions"

  node:
    name: Node — server, store and regression tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          # build-catalogue-manifest --check compares the manifest against git,
          # so a shallow clone would make it fail for the wrong reason.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Catalogue manifest is current
        # The catalogue tells the LMS which rows survive a redeploy. It cannot be
        # computed at runtime (.dockerignore excludes .git), so a stale manifest
        # would silently mislabel a new video as ephemeral.
        run: node scripts/build-catalogue-manifest.js --check

      - name: Tests
        # Runs without a .env: the tests that need one skip rather than fail.
        run: npm test

  pipeline-gates:
    name: Render gates, in the deploy image
    runs-on: ubuntu-latest
    # The job that would have saved $2.81. The render gates can only be exercised
    # against a real video in a real container, and until this existed the only
    # way to run one was to BUY a lesson: each paid render surfaced exactly one
    # failure and stopped. Worse, the environment that broke was never the one
    # under test -- a developer laptop has Chrome, so a missing browser in the
    # container stayed invisible until production had already spent the money.
    #
    # Here the image is the deploy image, the videos are real committed ones, and
    # the art is flat colour written by scripts/make-fixture-assets.js, so a run
    # costs nothing and exercises every gate against every fixture.
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Puppeteer 25 needs >= 22.12, and the deploy image is node:22. Pinning
          # 20 here would test a runtime production does not use -- which is the
          # same class of mistake as testing on a laptop.
          node-version: '22'

      - name: Run the gates against the fixture corpus
        # Two shapes on purpose: one illustration-led, one text-heavy. A rule
        # written against one and never run against the other is exactly the
        # defect this pack was built to catch.
        run: bash scripts/pipeline-harness.sh

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Check for TODO markers
        run: |
          echo "Checking for hardcoded API keys..."
          if grep -r "sk-ant-" . --include="*.py" --exclude-dir=.git --exclude-dir=venv; then
            echo "WARNING: API keys found in code (should be in .env)"
          fi

      - name: Verify file structure
        run: |
          for dir in skills agents prompts tests; do
            if [ ! -d "$dir" ]; then
              echo "ERROR: Required directory missing: $dir"
              exit 1
            fi
          done
          echo "✓ All required directories present"

  notify:
    name: Post Results
    runs-on: ubuntu-latest
    if: always()
    needs: [test, node, lint]

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.node.result }}" = "success" ] && [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ All checks passed"
          else
            echo "❌ Some checks failed"
            exit 1
          fi
