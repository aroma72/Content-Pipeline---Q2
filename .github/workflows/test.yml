name: Test & Validate Infrastructure

on: [push, pull_request]

jobs:
  test:
    name: Run Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint - Check for hardcoded prompts
        run: |
          echo "Checking for hardcoded SYSTEM_PROMPT in skills/agents..."
          if grep -r "^SYSTEM_PROMPT = " skills/ agents/ --include="*.py"; then
            echo "ERROR: Hardcoded SYSTEM_PROMPT found. Extract to prompts/ directory."
            exit 1
          else
            echo "✓ No hardcoded prompts found"
          fi

      - name: Lint - Verify prompts directory
        run: |
          if [ ! -d "prompts/" ] || [ -z "$(ls -A prompts/)" ]; then
            echo "ERROR: prompts/ directory missing or empty"
            exit 1
          fi
          echo "✓ prompts/ directory exists with $(ls prompts/ | wc -l) files"

      - name: Lint - Check requirements.txt
        run: |
          if ! grep -q "^pytest" requirements.txt; then
            echo "ERROR: pytest removed from requirements.txt"
            exit 1
          fi
          echo "✓ pytest in requirements.txt"

      - name: Run unit tests
        run: |
          pytest tests/test_signal_intake.py -v --tb=short

      - name: Run all tests with coverage
        run: |
          pytest tests/ -v --cov=skills --cov=agents --cov-report=term-missing

      - name: Validate pipeline structure
        run: |
          python main.py --dry-run > /tmp/pipeline.log
          if grep -q "PERCEIVE" /tmp/pipeline.log && grep -q "PLAN" /tmp/pipeline.log; then
            echo "✓ Pipeline structure validated"
            cat /tmp/pipeline.log
          else
            echo "ERROR: Pipeline structure validation failed"
            cat /tmp/pipeline.log
            exit 1
          fi

      - name: Verify logger directory
        run: |
          if [ ! -d ".claude/logs" ]; then
            echo "ERROR: .claude/logs directory missing"
            exit 1
          fi
          echo "✓ Logger directory exists"

      - name: Check eval dataset
        run: |
          if [ ! -d "tests/eval_dataset/sample_sessions" ]; then
            echo "ERROR: eval dataset missing"
            exit 1
          fi
          echo "✓ Eval dataset exists with $(find tests/eval_dataset -type d -name session_* | wc -l) sessions"

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Check for TODO markers
        run: |
          echo "Checking for hardcoded API keys..."
          if grep -r "sk-ant-" . --include="*.py" --exclude-dir=.git --exclude-dir=venv; then
            echo "WARNING: API keys found in code (should be in .env)"
          fi

      - name: Verify file structure
        run: |
          for dir in skills agents prompts tests; do
            if [ ! -d "$dir" ]; then
              echo "ERROR: Required directory missing: $dir"
              exit 1
            fi
          done
          echo "✓ All required directories present"

  notify:
    name: Post Results
    runs-on: ubuntu-latest
    if: always()
    needs: [test, lint]

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ All checks passed"
          else
            echo "❌ Some checks failed"
            exit 1
          fi
