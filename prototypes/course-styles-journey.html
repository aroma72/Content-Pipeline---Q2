<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Course Builder · Video Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: the LMS course builder — a narrow left step rail, one working panel; same tokens as prototypes/course-builder.html */
:root{
  --blue:#2563EB; --blue-soft:#EEF2FF; --blue-ink:#1D4ED8;
  --green:#16A34A; --green-soft:#DCFCE7;
  --amber-bg:#FEF3C7; --amber-ink:#B45309;
  --page:#F7F8FA; --card:#FFFFFF; --line:#E5E7EB; --line-soft:#F1F3F5;
  --ink:#111827; --muted:#6B7280; --chip:#F3F4F6; --code:#F8FAFC;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#60A5FA; --blue-soft:#1E293B; --blue-ink:#93C5FD;
  --green:#4ADE80; --green-soft:#14301F;
  --amber-bg:#3A2A0C; --amber-ink:#FCD34D;
  --page:#0F1115; --card:#171A21; --line:#2A2F3A; --line-soft:#20242D;
  --ink:#E5E7EB; --muted:#9CA3AF; --chip:#222733; --code:#12151B; color-scheme:dark }}
:root[data-theme="dark"]{
  --blue:#60A5FA; --blue-soft:#1E293B; --blue-ink:#93C5FD;
  --green:#4ADE80; --green-soft:#14301F;
  --amber-bg:#3A2A0C; --amber-ink:#FCD34D;
  --page:#0F1115; --card:#171A21; --line:#2A2F3A; --line-soft:#20242D;
  --ink:#E5E7EB; --muted:#9CA3AF; --chip:#222733; --code:#12151B; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:700;font-size:16px}.brand span{color:var(--muted);font-weight:500}
.proto{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--amber-ink);background:var(--amber-bg);padding:4px 10px;border-radius:999px}
.layout{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.rail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){.rail{position:static;flex-direction:row;flex-wrap:wrap}}
.step{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px;border:0;background:none;text-align:left;cursor:pointer;font-family:inherit}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--chip);color:var(--muted);flex:none}
.step.on{background:var(--blue-soft);color:var(--blue-ink)}.step.on .n{background:var(--blue);color:#fff}
.step.done .n{background:var(--green);color:#fff}
.step:disabled{cursor:default;opacity:.6}
.step:focus-visible,.btn:focus-visible,.style-card:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;min-width:0}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px;max-width:65ch}
.styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.style-card{border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:var(--card);display:flex;flex-direction:column;text-align:left;padding:0;font-family:inherit;color:inherit}
.style-card[aria-checked="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.style-card video{width:100%;aspect-ratio:16/9;display:block;background:#000;max-width:100%}
.sc-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.sc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc-head b{font-size:16px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.blue{background:var(--blue-soft);color:var(--blue-ink)}.pill.green{background:var(--green-soft);color:var(--green)}
.sc-body p{margin:0;color:var(--muted);font-size:14px}
.sc-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.ws{border-top:1px solid var(--line-soft);padding-top:10px;display:grid;gap:8px}
.ws-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ws-who{font-size:14px;margin:0}
.ws-who span{color:var(--muted)}
.ws details{font-size:14px}
.ws summary{cursor:pointer;font-weight:600;color:var(--blue-ink);width:max-content;max-width:100%}
.ws ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;color:var(--ink)}
.script{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--line);background:var(--code);border-radius:0 8px 8px 0;display:grid;gap:8px}
.script p{margin:0;font-size:14px;color:var(--ink)}
.script .read{display:block;font-size:12px;font-style:italic;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:22px}
.btn{font-family:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;gap:14px;max-width:720px}
label{font-weight:600;font-size:14px;display:grid;gap:6px}
input,textarea{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
textarea{min-height:84px;resize:vertical}
.chosen{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--blue-soft);color:var(--blue-ink);font-size:14px;margin-bottom:16px;flex-wrap:wrap}
.api{margin-top:22px;border-top:1px dashed var(--line);padding-top:12px;font-size:12px;color:var(--muted)}
.api code{font-family:var(--mono);background:var(--code);border:1px solid var(--line-soft);padding:1px 6px;border-radius:5px;color:var(--ink)}
.api summary{cursor:pointer;font-weight:600}
.api pre{font-family:var(--mono);background:var(--code);border:1px solid var(--line-soft);padding:10px;border-radius:8px;overflow-x:auto;color:var(--ink);font-size:12px}
.slos{display:grid;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.slos li{display:flex;gap:10px;font-size:14px}.slos .id{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue-ink);min-width:28px}
h2{font-size:15px;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.lessons{display:grid;gap:12px}
.lesson{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.lesson-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lesson-top b{font-size:15px}
.lesson-top .wk{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.grid2>div{min-width:0}
.lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.lesson ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.lesson ul b{font-weight:600}
.lesson .au{color:var(--muted)}
.scenario{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:14px}
.estimate{display:flex;flex-wrap:wrap;gap:18px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin-top:18px;font-size:14px}
.estimate b{font-size:18px;font-variant-numeric:tabular-nums;display:block}
.note{font-size:13px;color:var(--muted)}
.status{display:grid;gap:8px}
.srow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;flex-wrap:wrap}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:30px 0}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">Taleemabad University <span>· Course Builder</span></div>
    <div class="proto">Prototype · nothing is sent</div>
  </div>
  <div class="layout">
    <nav class="rail" aria-label="Steps">
      <button class="step" data-go="1" type="button"><span class="n">1</span>Video style</button>
      <button class="step" data-go="2" type="button"><span class="n">2</span>Course details</button>
      <button class="step" data-go="3" type="button"><span class="n">3</span>Review plan</button>
      <button class="step" data-go="4" type="button"><span class="n">4</span>Build</button>
    </nav>
    <main class="panel" id="panel" aria-live="polite"></main>
  </div>
</div>

<script>
const STYLES = [
  { id:'character-arc', label:'Character Arc', def:true, cost:1.5,
    summary:'A story-led explainer: one illustrated character, Ali, is followed through a single real scenario, with painted scenes and animated story moments.',
    bestFor:'Concepts that land best as a story: tools, workflows, before-and-after change.',
    preview:'https://aroma72.github.io/course-styles-prototype/previews/character-arc.mp4',
    writing:{ narrator:'A warm mentor tells the story of Ali, an invented character, in the third person.',
      voice:'Warm, friendly mentor voice, one steady read throughout.',
      rules:['Leads with the answer, then follows Ali through one real scenario in depth.',
        'Story arc: the problem, the fix, why it works, the common mistake, the payoff.',
        'One short spoken sentence per scene, with real numbers on screen.'],
      sample:[['Self-healing is not a smarter brain; it is a room that catches its own mistakes.'],
        ['Ali keeps every order in one paper ledger on his shop counter.'],
        ['He asks his AI helper which orders from last month were never paid.'],
        ['One date in that request is wrong, so the answer comes back completely blank.'],
        ['Three weeks later the supplier arrives and drops the unpaid bills on his counter.']] } },
  { id:'motion-graphics', label:'Flat Motion Graphics', def:false, cost:0.5,
    summary:'Flat, colourful motion graphics: bold titles, icons and simple figures, with each skill taught through a named model and walked through on real situations, spoken directly to the learner as "you".',
    bestFor:'People skills, soft skills, frameworks and models, and step-by-step how-tos.',
    preview:'https://aroma72.github.io/course-styles-prototype/previews/motion-graphics.mp4',
    writing:{ narrator:'A calm, composed woman speaks straight to the learner as "you". No named character.',
      voice:'Calm and collected with steady energy; each line carries its own emotional cue.',
      rules:['Every skill is taught through a named model, credited to its author (e.g. SCARF, RASA, GROW).',
        'At least two real workplace situations are walked through step by step, with the exact words to say.',
        'Shape: hook, the model, walk-throughs, the common mistake, a three-line recap.'],
      sample:[['You are a P&C Buddy, and that role is bigger than it first looks.','with a warm, welcoming smile'],
        ['You care for the person, and you stay fair to the organisation, both at the same time.','calmly and with conviction'],
        ['Lean only toward the person, and you end up taking sides.','with a gentle note of caution'],
        ['Say an employee tells you their manager never gives them any feedback.','with empathy'],
        ['A supporter asks what they have tried, and helps them plan that conversation themselves.','warmly and confidently']] } },
];

// Example plan for the motion-graphics style — Course 1 of the P&C outline.
const MOTION_PLAN = {
  title:'Understanding & Listening to People',
  slos:[
    ['1.1','Explain the P&C Buddy\'s role at each stage: candidate, onboarding, employee, alumni'],
    ['1.2','Apply "care for the person, stay fair to the organisation", and tell supporting from rescuing'],
    ['1.3','Interpret a reaction as a signal of an underlying need, without taking it personally'],
    ['1.4','Demonstrate active listening: full attention, summarising and reflecting back'],
    ['1.5','Use open, probing and clarifying questions, and avoid leading or blaming ones'],
    ['1.6','Respond with empathy while staying objective, separating facts, feelings and assumptions'],
  ],
  lessons:[
    { wk:'Week 1', title:'Your Role as a P&C Buddy', ids:['1.1','1.2'],
      models:[['Employee Lifecycle','','Candidate → Onboarding → Employee → Alumni'],
        ['Empowerment Dynamic','David Emerald','act as a Coach, not a Rescuer'],
        ['Fair Process, the 3 E\'s','Kim & Mauborgne','Engage, Explain, set Expectations']],
      walks:[['Rescuer vs Coach','An employee says their manager never gives feedback.'],
        ['The 3 E\'s','A candidate\'s offer is delayed by a policy you can\'t change.']] },
    { wk:'Week 2', title:'Look Beyond the Reaction', ids:['1.3'],
      models:[['The Iceberg','','behaviour above, needs and fears below'],
        ['SCARF','David Rock','Status, Certainty, Autonomy, Relatedness, Fairness']],
      walks:[['Certainty','A new joiner snaps at you over a laptop delay.'],
        ['Status','A senior employee goes quiet after a restructure announcement.']] },
    { wk:'Week 3', title:'Listen First, Then Ask', ids:['1.4','1.5'],
      models:[['RASA','Julian Treasure','Receive, Appreciate, Summarise, Ask'],
        ['OARS','Motivational Interviewing','Open questions, Affirmations, Reflections, Summaries'],
        ['The Question Funnel','','open → probe → close']],
      walks:[['Quick chat','"Can we have a quick chat?" The real issue surfaces after three questions.'],
        ['Leading vs open','The same exit interview, run with leading questions and then with OARS.']] },
    { wk:'Week 4', title:'Warm but Fair', ids:['1.6'],
      models:[['Ladder of Inference','Chris Argyris','climb back down to the observable facts'],
        ['GROW','John Whitmore','Goal, Reality, Options, Way forward']],
      walks:[['Ladder of Inference','You hear an employee is "always late, doesn\'t care".'],
        ['GROW','An employee is in a personal crisis; support without over-promising.']] },
  ],
};
const ARC_PLAN = {
  title:'Understanding & Listening to People',
  scenario:'Ali, a new P&C Buddy at a Lahore office, supports one new joiner from offer letter to their first review.',
  lessons:[
    { wk:'Module 1', title:'Ali meets the new joiner', slo:'Given a nervous new joiner, the learner can name what a Buddy owns at each stage.' },
    { wk:'Module 1', title:'Ali looks beyond the snap', slo:'Given an irritated reply, the learner can identify the need behind it.' },
    { wk:'Module 2', title:'Ali listens before he answers', slo:'Given a "quick chat", the learner can ask open, then probing, then closed questions.' },
    { wk:'Module 2', title:'Ali stays warm but fair', slo:'Given a complaint about a colleague, the learner can separate facts from conclusions.' },
  ],
};

const state = { step:1, style:null, maxStep:1, topic:'People skills for P&C Buddies',
  audience:'P&C Buddies who own the employee journey', duration:'4 weeks, one video a week',
  desc:'Human behaviour, active listening, asking the right questions, empathy with objectivity.' };
const panel = document.getElementById('panel');
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const styleOf = () => STYLES.find((s) => s.id === state.style);

function rail(){
  document.querySelectorAll('.step').forEach((b) => {
    const n = +b.dataset.go;
    b.classList.toggle('on', n === state.step);
    b.classList.toggle('done', n < state.step);
    b.disabled = n > state.maxStep;
  });
}
function go(n){ state.step = n; state.maxStep = Math.max(state.maxStep, n); render(); panel.scrollIntoView({block:'nearest'}); }
function api(lines){ return `<details class="api"><summary>For the LMS developer: what this step calls</summary>${lines}</details>`; }

function step1(){
  return `<h1>Choose a video style</h1>
  <p class="lead">Every video in this course is made in the style you pick. Watch the 12-second samples, then choose one.</p>
  <div class="styles" role="radiogroup" aria-label="Video style">
    ${STYLES.map((s) => `
    <div class="style-card" role="radio" tabindex="0" aria-checked="${state.style === s.id}" data-style="${s.id}">
      <video src="${s.preview}" muted loop playsinline autoplay preload="metadata" aria-label="${esc(s.label)} sample"></video>
      <div class="sc-body">
        <div class="sc-head"><b>${esc(s.label)}</b>${s.def ? '<span class="pill">Default</span>' : '<span class="pill blue">New</span>'}</div>
        <p>${esc(s.summary)}</p>
        <div class="sc-meta"><span class="pill">Best for: ${esc(s.bestFor)}</span><span class="pill green">≈ $${s.cost.toFixed(2)} per video</span></div>
        <div class="ws">
          <div class="ws-h">How the script sounds</div>
          <p class="ws-who">${esc(s.writing.narrator)} <span>${esc(s.writing.voice)}</span></p>
          <details>
            <summary>Read a sample script</summary>
            <ul>${s.writing.rules.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
            <div class="script">${s.writing.sample.map(([l, r]) => `<p>“${esc(l)}”${r ? `<span class="read">read ${esc(r)}</span>` : ''}</p>`).join('')}</div>
          </details>
        </div>
      </div>
    </div>`).join('')}
  </div>
  <div class="actions"><button class="btn primary" id="next1" type="button" ${state.style ? '' : 'disabled'}>Continue</button></div>
  ${api(`<p><code>GET /api/v1/styles</code> (no token) returns each style's <code>label</code>, <code>summary</code>, <code>bestFor</code>, <code>estimatedCostPerLessonUsd</code>, <code>writingStyle</code> (narrator, voice, rules, real sample lines) and <code>previewUrl</code> (<code>/api/v1/styles/:id/preview.mp4</code>, plays in a <code>&lt;video&gt;</code> tag).</p>`)}`;
}
function step2(){
  const s = styleOf();
  return `<h1>Course details</h1>
  <div class="chosen"><span>Style:</span><b>${esc(s.label)}</b><button class="btn" data-go2="1" type="button">Change</button></div>
  <form class="form" id="f2">
    <label for="topic">Topic<input id="topic" value="${esc(state.topic)}"></label>
    <label for="audience">Audience<input id="audience" value="${esc(state.audience)}"></label>
    <label for="duration">Duration<input id="duration" value="${esc(state.duration)}"></label>
    <label for="desc">What it should cover<textarea id="desc">${esc(state.desc)}</textarea></label>
  </form>
  <div class="actions"><button class="btn" data-go2="1" type="button">Back</button><button class="btn primary" id="plan" type="button">Generate plan</button></div>
  ${api(`<pre>POST /api/v1/courses/plan
{ "topic": "…", "audience": "…", "duration": "…", "description": "…",
  "style": "${s.id}" }</pre>`)}`;
}
function step3(){
  const s = styleOf();
  const motion = s.id === 'motion-graphics';
  const n = motion ? MOTION_PLAN.lessons.length : ARC_PLAN.lessons.length;
  const body = motion ? `
    <h2>Course SLOs</h2>
    <ul class="slos">${MOTION_PLAN.slos.map(([id, t]) => `<li><span class="id">${id}</span><span>${esc(t)}</span></li>`).join('')}</ul>
    <h2>Lessons</h2>
    <div class="lessons">${MOTION_PLAN.lessons.map((l) => `
      <article class="lesson">
        <div class="lesson-top"><span class="wk">${l.wk}</span><div class="chips">${l.ids.map((i) => `<span class="pill blue">SLO ${i}</span>`).join('')}</div></div>
        <b>${esc(l.title)}</b>
        <div class="grid2">
          <div><div class="lab">Models</div><ul>${l.models.map(([m, a, x]) => `<li><b>${esc(m)}</b>${a ? ` <span class="au">(${esc(a)})</span>` : ''}: ${esc(x)}</li>`).join('')}</ul></div>
          <div><div class="lab">Walk-throughs</div><ul>${l.walks.map(([t, x]) => `<li><b>${esc(t)}:</b> ${esc(x)}</li>`).join('')}</ul></div>
        </div>
      </article>`).join('')}</div>` : `
    <h2>Running scenario</h2><div class="scenario">${esc(ARC_PLAN.scenario)}</div>
    <h2>Lessons</h2>
    <div class="lessons">${ARC_PLAN.lessons.map((l) => `
      <article class="lesson"><div class="lesson-top"><span class="wk">${l.wk}</span></div><b>${esc(l.title)}</b><div class="note">SLO: ${esc(l.slo)}</div></article>`).join('')}</div>`;
  return `<h1>${esc(motion ? MOTION_PLAN.title : ARC_PLAN.title)}</h1>
  <div class="chosen"><span>Style:</span><b>${esc(s.label)}</b><span class="note">Example plan for review. Everything here can be edited before building.</span></div>
  ${body}
  <div class="estimate"><div><span class="note">Videos</span><b>${n}</b></div><div><span class="note">Estimated cost</span><b>$${(n * s.cost).toFixed(2)}</b></div><div><span class="note">Length</span><b>~${motion ? 2 : 2.5} min each</b></div></div>
  <div class="actions"><button class="btn" data-go2="2" type="button">Back</button><button class="btn primary" data-go2="4" type="button">Build ${n} videos</button></div>
  ${api(motion
    ? `<p>In this style the plan also returns <code>slos[]</code>, and per lesson <code>sloIds</code>, <code>models[]</code> (name, author, summary) and <code>walkthroughs[]</code> (title, situation). Build refuses a lesson with no model or fewer than two walk-throughs (<code>400 invalid_plan</code>), so keep them if the plan is edited.</p>`
    : `<p>The Character Arc plan is unchanged: a running scenario for Ali, and per lesson an SLO, a brief and a question.</p>`)}`;
}
function step4(){
  const s = styleOf();
  const lessons = (s.id === 'motion-graphics' ? MOTION_PLAN : ARC_PLAN).lessons;
  return `<h1>Building your course</h1>
  <div class="chosen"><span>Style:</span><b>${esc(s.label)}</b><span class="note">One video at a time. You approve each one before the next begins.</span></div>
  <div class="status">${lessons.map((l, i) => `<div class="srow"><span><b>${esc(l.title)}</b> <span class="note">· ${l.wk}</span></span>${i === 0 ? '<span class="pill blue">Writing the script</span>' : '<span class="pill">Queued</span>'}</div>`).join('')}</div>
  <p class="note" style="margin-top:14px">In both styles, the lesson's question is never in the video. The video pauses, the learner answers, sees feedback, and the video resumes.</p>
  <div class="actions"><button class="btn" id="restart" type="button">Start over</button></div>
  ${api(`<pre>POST /api/v1/courses/build
{ "plan": &lt;the plan&gt;, "confirmLessons": ${lessons.length}, "series": "…", "style": "${s.id}" }
→ 202 { "courseId": "…", "style": "${s.id}", … }

GET /api/v1/courses/:courseId   → "style" on the course and on every lesson</pre>`)}`;
}

function render(){
  rail();
  if (state.step === 3 && !state.planned) {
    panel.innerHTML = '<div class="loading"><span class="spin"></span>Planning the course…</div>';
    setTimeout(() => { state.planned = true; render(); }, 900);
    return;
  }
  panel.innerHTML = [null, step1, step2, step3, step4][state.step]();
  if (state.step === 1) {
    panel.querySelectorAll('.style-card').forEach((c) => {
      const pick = (e) => {
        if (e && e.target.closest('details')) return;   // reading the sample is not choosing
        if (state.style === c.dataset.style) return;
        state.style = c.dataset.style; state.planned = false; render();
      };
      c.addEventListener('click', pick);
      c.addEventListener('keydown', (e) => { if (e.target === c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(); } });
    });
    const n1 = document.getElementById('next1'); if (n1) n1.addEventListener('click', () => go(2));
  }
  if (state.step === 2) {
    ['topic','audience','duration','desc'].forEach((k) => {
      const el = document.getElementById(k); el.addEventListener('input', () => { state[k] = el.value; });
    });
    document.getElementById('plan').addEventListener('click', () => { state.planned = false; go(3); });
  }
  panel.querySelectorAll('[data-go2]').forEach((b) => b.addEventListener('click', () => go(+b.dataset.go2)));
  const r = document.getElementById('restart');
  if (r) r.addEventListener('click', () => { Object.assign(state, { step:1, maxStep:1, style:null, planned:false }); render(); });
}
document.querySelectorAll('.step').forEach((b) => b.addEventListener('click', () => { if (!b.disabled) go(+b.dataset.go); }));
render();
</script>
</body>
</html>
